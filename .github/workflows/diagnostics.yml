name: Diagnostics

# OPTIONAL BY DESIGN.
#
# This workflow is dispatch-only. It never runs on push or pull_request and it
# never gates anything. It exists so a full declared-control sensitivity screen
# can be run on demand against a known engine version, without paying for it on
# every change and without being able to block a commit.
#
# It uses tools/diagnostics/evo-diagnostics.mjs (dependency-free, node builtins
# only). It BUILDS the viewer HTML from source first, so the screen always
# reflects current engine code rather than a committed artefact.
#
# Beware the build split documented in AGENTS.md: the app bundle comes from
# tsconfig.app.json (build/app/), the CLI probes from tsconfig.build.json
# (build/). This workflow uses tsconfig.app.json for the bundle.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Diagnostic suite to run
        type: choice
        default: config-only
        options:
          - config-only
          - factorial-core
          - target
      target:
        description: Config key (only used when suite = target)
        type: string
        default: nutrientRegen
      seeds:
        description: Seed panel (comma-separated, or "1:N" for a range)
        type: string
        default: "1:10"
      legs:
        description: Parallel seed shards (higher = faster, more CPU)
        type: string
        default: "4"
      ticks:
        description: Ticks per run
        type: string
        default: "1500"
      interval:
        description: Checkpoint interval
        type: string
        default: "100"
      mode:
        description: Engine mode
        type: choice
        default: balanced
        options: [balanced, base]
  workflow_call:
    inputs:
      suite:
        type: string
        default: config-only
      target:
        type: string
        default: nutrientRegen
      seeds:
        type: string
        default: "1:10"
      legs:
        type: string
        default: "4"
      ticks:
        type: string
        default: "1500"
      interval:
        type: string
        default: "100"
      mode:
        type: string
        default: balanced

permissions:
  contents: read

# QUEUE, DO NOT REPLACE — same reason and same fix as ladder.yml.
#
# The default `queue: single` cancels the PENDING run when a newer one is
# dispatched, so two screens submitted in quick succession silently dropped the
# first. Diagnostics screens are expensive and slow to re-run; losing one loses
# the measurement. `queue: max` preserves up to 100 pending runs in order, and
# GitHub cancels only once that queue is full.
#
# `queue: max` is incompatible with `cancel-in-progress: true` (a validation
# error), so the flag stays false. A fixture asserts the pair.
#
# Screens on DIFFERENT suites are kept apart so a config-only screen cannot
# block a factorial screen behind it.
concurrency:
  group: diagnostics-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: false
  queue: max

jobs:
  diagnostics:
    name: Diagnostic screen
    runs-on: ubuntu-latest
    # Bounded so a mistyped seed panel cannot burn an unbounded amount of time.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      # The lockfile is committed, so this is reproducible and cached.
      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund

      # Cheap gates first: do not spend a full screen on code that does not
      # typecheck or fails its behavioural gates. Gates run compiled so esbuild's
      # postinstall is not on the path.
      - name: Typecheck
        run: npm run typecheck

      - name: Build CLI probes
        run: npm run view:build

      - name: Behavioural gates
        run: npm run gates:compiled

      - name: Build viewer from source
        run: npm run build:app

      # The kit reads the engine out of the HTML sitting beside it.
      - name: Stage engine HTML for the kit
        run: cp evidence/app/evo-sim-poc.html tools/diagnostics/evo-sim-poc.html

      # Presence check, not just parity. Parity proves defaults behave; it
      # cannot detect that an intended config key is missing from the built
      # engine. This is the check that would have caught the stale-bundle bug.
      - name: Assert new knobs reached the built engine
        run: |
          set -euo pipefail
          missing=0
          for key in reproSurplusTicks mixotrophyCarbon nutrientCyclic nutrientFloor dormantThreatBlind decomposerPhotoScale; do
            if ! grep -q "$key" tools/diagnostics/evo-sim-poc.html; then
              echo "::error::config key absent from built engine: $key"
              missing=1
            fi
          done
          exit $missing

      # Dispatch inputs reach the script through the ENVIRONMENT, never by
      # interpolation into the run: body. GitHub expands `${{ }}` BEFORE the
      # shell parses anything, so a value containing $(id) executes during
      # expansion — ahead of every validation the planner or the kit performs.
      # Quoting does not help; the substitution has already happened.
      #
      # The planner's only job here is to REJECT bad input loudly, at dispatch
      # time, before an expensive screen is launched. It does not shard: this job
      # runs the legs itself via run-diagnostics.sh, which does its own
      # expansion through the same validated expander. Two allocators would be
      # two answers to "which seeds does leg N cover".
      - name: Validate dispatch inputs
        env:
          DIAG_SEEDS: ${{ inputs.seeds }}
          DIAG_LEGS: ${{ inputs.legs }}
          DIAG_TICKS: ${{ inputs.ticks }}
          DIAG_INTERVAL: ${{ inputs.interval }}
          DIAG_MODE: ${{ inputs.mode }}
          DIAG_SUITE: ${{ inputs.suite }}
          DIAG_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          node tools/diagnostics/plan-seeds.mjs cli \
            "$DIAG_SEEDS" "$DIAG_LEGS" "$DIAG_TICKS" "$DIAG_INTERVAL" \
            "$DIAG_MODE" "$DIAG_SUITE" "$DIAG_TARGET"

      - name: Run diagnostics
        env:
          DIAG_KIT: tools/diagnostics/evo-diagnostics.mjs
          DIAG_OUT: ./diag-out
          DIAG_SEEDS: ${{ inputs.seeds }}
          DIAG_LEGS: ${{ inputs.legs }}
          DIAG_TICKS: ${{ inputs.ticks }}
          DIAG_INTERVAL: ${{ inputs.interval }}
          DIAG_MODE: ${{ inputs.mode }}
          DIAG_SUITE: ${{ inputs.suite }}
          DIAG_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          sh scripts/run-diagnostics.sh \
            "$DIAG_KIT" "$DIAG_OUT" "$DIAG_LEGS" "$DIAG_SEEDS" \
            "$DIAG_TICKS" "$DIAG_INTERVAL" "$DIAG_MODE" "$DIAG_SUITE" "$DIAG_TARGET"

      # A screen that cannot report is not a screen. Legs write separate output
      # directories and are deliberately NOT merged — merging hand-written CSVs to
      # fake one result file would be fabricating a combined measurement. Each leg
      # manifest states the seeds it covered.
      #
      # This step previously printed `m.targets.length` unconditionally, but the
      # factorial-core manifest carries `switches` and no `targets` at all. A
      # fully successful factorial screen therefore threw inside this
      # `if: always()` step and left the workflow reporting FAILURE. The
      # summariser reads whichever schema is present and never throws.
      #
      # It also never fails the job: whether the EXPERIMENT succeeded is the
      # experiment job's business. This step only describes what exists.
      - name: Summarise
        if: always()
        env:
          DIAG_OUT: ./diag-out
        run: |
          set -euo pipefail
          node tools/diagnostics/summarise.mjs "$DIAG_OUT"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: diagnostics-${{ github.run_number }}
          path: diag-out/
          if-no-files-found: warn
