name: Ladder

# OPTIONAL BY DESIGN — same status as Diagnostics.
#
# Dispatch-only. Never runs on push or pull_request, never gates anything.
#
# It exists because ladder runs are SUSTAINED work: 36 seeds x 6000 ticks is far
# past what belongs on a phone, and AGENTS.md forbids running long horizons
# through tsx (transpilation exhausts the device). GitHub Actions is the right
# host, which is exactly why this is optional and never a gate.
#
# THE POINT OF THIS WORKFLOW IS THE ARM CHECK, NOT THE NUMBER.
#
# tools/ladder/arms.json is version controlled and carries the pre-registration
# (hypothesis, prediction, falsification condition, confounds). The 0.4.1 ladder
# had no such record: it was launched ad hoc, and although the probe echoed its
# raw slot arguments into the header, it did not record which --zero-lift dials
# were applied or at what values. Those arms are therefore NOT exactly
# reproducible from their own artifacts and must not be reported as replicated.
#
# run-arm.mjs re-reads the probe's emitted header and FAILS the leg if it does
# not match the declared arm. An arm that silently differs from its declaration
# produces no data.
#
# Per-seed outputs are uploaded PER LEG and are deliberately NOT merged.
# Merging hand-written rows into one combined measurement fabricates a result
# that nobody ran.

on:
  workflow_dispatch:
    inputs:
      arm:
        description: Pre-registered arm to run
        type: choice
        default: flatline
        options:
          - flatline
          - consumer-yield
          - prospective-guilds
          - balance-diagnostic-control
          - balance-diagnostic-share1
          - graze-link
          - graze-subsidy05
          - graze-subsidy01
          # `horizon` is deliberately NOT offered. It is retained in arms.json as
          # provenance with status HISTORICAL: its registered hypothesis was for
          # the 0.5.0 LEAKY engine, whose four seeds are not 0.6.0 survivors, so a
          # green run would look current while testing a superseded contrast.
          # run-arm.mjs refuses it unless --historical-spec is passed, and that flag replays
          # the arm SETTINGS on the CURRENT engine — it does NOT reproduce the
          # original figure.
      ticks:
        description: Horizon override in ticks (BLANK = use the arm's pre-registered ticks)
        type: string
        default: ""
      legs:
        description: Parallel seed shards (higher = faster, more CPU)
        type: string
        default: "6"

permissions:
  contents: read

# QUEUE, DO NOT REPLACE.
#
# GitHub's documented default for a concurrency group is `queue: single`: at
# most one run may be PENDING, and a new run CANCELS the pending one waiting
# behind it. Two ladder dispatches submitted an hour apart on the same branch
# therefore silently dropped the first, with a cancelled status that reads like
# an ordinary cancellation rather than a policy decision. This repository loses
# experiments that way, and a lost experiment is a lost measurement.
#
# `queue: max` lets up to 100 runs wait and execute in order, so every dispatched
# experiment survives. When the queue is full, further runs are cancelled: that
# is the spend cap, and it is GitHub's rather than ours.
#
# `queue: max` with `cancel-in-progress: true` is a workflow VALIDATION ERROR,
# so cancel-in-progress must stay false. A fixture asserts both halves of that
# constraint, because the failure mode is a workflow that cannot run at all.
#
# The group is keyed on branch AND arm, so different arms never block each
# other. It deliberately does NOT include `github.run_attempt`: that counter
# starts at 1 for every newly dispatched run, so it is not a dispatch identity,
# and including it gave a false impression of separating same-arm dispatches.
concurrency:
  group: ladder-${{ github.ref }}-${{ inputs.arm }}
  cancel-in-progress: false
  queue: max

jobs:
  # Cap legs at the seed count so no leg launches with zero seeds to run.
  plan:
    name: Plan shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      legs: ${{ steps.plan.outputs.legs }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        env:
          # Same rule as the Run arm step: dispatch input via the environment,
          # never interpolated into the script body.
          LADDER_ARM: ${{ inputs.arm }}
          LADDER_LEGS: ${{ inputs.legs }}
        run: |
          set -euo pipefail
          node tools/ladder/plan-legs.js "$LADDER_ARM" "$LADDER_LEGS"

  ladder:
    name: Ladder leg ${{ matrix.leg }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      # The lockfile is committed, so this is reproducible and cached.
      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund

      # Compiled, not tsx. Gates run compiled so esbuild's postinstall is not on
      # the path and so transpilation never holds the module graph.
      - name: Typecheck
        run: npm run typecheck

      - name: Build CLI probes
        run: npm run view:build

      # Cheap gates first: do not spend 36 seeds x 6000 ticks on an engine that
      # fails its own credibility suite.
      - name: Behavioural gates
        run: npm run gates:compiled

      # Report the pre-registration up front, so a reader sees the hypothesis
      # and the falsification condition BEFORE any result.
      #
      # The arm name arrives through the ENVIRONMENT, never as `${{ inputs.arm }}`
      # inside the script body. GitHub expands expressions before the shell
      # parses anything, so an interpolated value containing $(id) would execute
      # during expansion — ahead of any validation, in a workflow step that runs
      # with the repository checked out.
      - name: Show pre-registration
        env:
          LADDER_ARM: ${{ inputs.arm }}
        run: |
          set -euo pipefail
          node tools/ladder/plan-legs.js prereg "$LADDER_ARM"

      - name: Run arm
        env:
          # Dispatch inputs are passed through the ENVIRONMENT, not
          # interpolated into the script body. GitHub substitutes `${{ }}`
          # before the shell parses anything, so a value like $(id) would
          # execute during expansion, ahead of any validation the runner does.
          # Shell indirection also keeps the quoting honest.
          LADDER_ARM: ${{ inputs.arm }}
          LADDER_TICKS: ${{ inputs.ticks }}
        run: |
          node tools/ladder/run-arm.mjs \
            tools/ladder/arms.json \
            "$LADDER_ARM" \
            ./ladder-out \
            "${{ matrix.leg }}" \
            "${{ needs.plan.outputs.legs }}" \
            "$LADDER_TICKS"

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          {
            echo ""
            echo "### Result (per-seed, NOT merged)"
            if [ -f ladder-out/summary.csv ]; then
              echo ""
              echo '```'
              head -40 ladder-out/summary.csv
              echo '```'
            fi
            if [ -f ladder-out/manifest.json ]; then
              node -e '
                const m=require("./ladder-out/manifest.json");
                console.log("- ran " + m.runs.length + "/" + m.seedCount + " seeds");
                console.log("- header mismatches: " + m.headerMismatches.length);
                console.log("- failures: " + m.failures.length);
                const p=m.preregistration;
                console.log("- prediction: " + p.prediction);
                console.log("- falsified if: " + p.falsification);
                console.log("");
                console.log("Judge against the pre-registration above, not against a");
                console.log("desired outcome. Nulls are results; record them.");
              '
            else
              echo ""
              echo "No manifest produced — the arm did not complete."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload arm outputs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ladder-${{ inputs.arm }}-${{ github.run_number }}-leg${{ matrix.leg }}
          path: ladder-out/
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # Cohort verification — the stage that was missing entirely.
  #
  # Every leg above checks ITS OWN output. None of them can tell whether the
  # PANEL was measured: a leg that never launched, a seed measured twice, or a
  # leg left over from a different engine all produce the same thing — a set of
  # green jobs and a meaningless number. `consumer-yield` predicted three-guild
  # survival on >= 12/18 seeds and nothing in the workflow ever established it.
  #
  # This stage is READ-ONLY over the artifacts the legs already uploaded. It
  # never re-runs a seed and never merges leg outputs into a single measured
  # result; it reports what the immutable per-leg evidence actually supports.
  #
  # IT DISTINGUISHES TWO VERDICTS, and the exit code follows only the first:
  #   integrity — was every declared seed measured exactly once, from one engine?
  #   science   — supported / falsified / not measured, per the pre-registration.
  # A falsified prediction is a RESULT and exits 0. Conflating it with a broken
  # run is how a genuine finding gets mistaken for bad infrastructure.
  # --------------------------------------------------------------------------
  cohort:
    name: Verify cohort
    needs: ladder
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LADDER_ARM: ${{ inputs.arm }}
      LADDER_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5

      # Download EVERY leg's immutable artifacts, one directory per artifact.
      #
      # `merge-multiple` MUST stay false. Each leg uploads `ladder-out/`, so each
      # artifact root holds its own manifest.json / summary.csv / seed-*.txt.
      # Merging them into one directory makes every leg overwrite the previous
      # one's manifest — the cohort then sees a single colliding manifest and
      # can never assemble a multi-leg panel at all. Separate directories are
      # what let the verifier prove disjoint, exhaustive seed coverage.
      - name: Download leg artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: ladder-${{ inputs.arm }}-${{ github.run_number }}-leg*
          path: legs
          merge-multiple: false

      - name: Verify cohort
        run: |
          set -euo pipefail
          # Collect each leg's directory explicitly. A glob that matched nothing
          # would pass an empty list to the verifier, and "no legs" must be a
          # failure rather than a vacuous success.
          set -- 
          for d in legs/*/; do
            [ -f "$d/manifest.json" ] && set -- "$@" "${d%/}"
          done
          if [ "$#" -eq 0 ]; then
            echo "::error::no leg manifests were produced; the panel was not measured"
            exit 1
          fi
          node tools/ladder/cohort-verify.mjs tools/ladder/arms.json "$LADDER_ARM" "$@"

      - name: Upload cohort verdict
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ladder-${{ inputs.arm }}-${{ github.run_number }}-cohort
          path: legs/
          if-no-files-found: warn
