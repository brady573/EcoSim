<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the layout reach under a notch, with the panels
         inset by env(safe-area-inset-*) so nothing hides beneath it.
         maximum-scale/user-scalable are deliberately NOT disabled: pinch-zoom on
         the page is an accessibility affordance, and the canvas handles its own
         zoom via pointer events, so browser zoom does not conflict with it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DE evolution POC — experimental viewer</title>
    <style>
      /* Minimal functional UI. Deliberately not polished: this exists to make
         emergence inspectable, not to be a product surface. */
      :root {
        color-scheme: dark;
        --bg: #0b0f14;
        --panel: #121821;
        --line: #243040;
        --text: #d7e0ea;
        --dim: #8698ad;
        --accent: #6ee7a8;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overscroll-behavior: none;
      }
      #stage { position: fixed; inset: 0; }
      canvas {
        display: block;
        /* Own every gesture on the canvas. Without this the browser claims
           one-finger panning and two-finger pinch for page zoom, so panning the
           world scrolls the page and pinch-zooms the document instead of the
           simulation. */
        touch-action: none;
        /* A long press over the canvas otherwise raises the iOS/Android
           selection callout and starts a text selection mid-drag. */
        -webkit-touch-callout: none; user-select: none; -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .panel {
        position: fixed; background: color-mix(in srgb, var(--panel) 88%, transparent);
        border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
        backdrop-filter: blur(6px);
        /* Never wider than the viewport minus its own margins. On a phone the
           previous fixed 240px/210px widths collided: 240 + 210 + margins
           exceeds a 412px viewport, so the controls and stats panels overlapped
           and swallowed each other's taps. */
        max-width: calc(100vw - 16px - env(safe-area-inset-left) - env(safe-area-inset-right));
      }
      #controls { top: calc(8px + env(safe-area-inset-top)); left: calc(8px + env(safe-area-inset-left)); width: 240px; }
      #stats { top: calc(8px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); min-width: 210px; }
      #inspect {
        bottom: calc(8px + env(safe-area-inset-bottom));
        left: calc(8px + env(safe-area-inset-left));
        width: min(46vw, 420px);
        /* dvh tracks the collapsing address bar; vh does not, which let the
           panel run under the browser chrome on mobile. */
        max-height: 52dvh; max-height: 52vh; overflow: auto; display: none;
      }
      #legend { bottom: calc(8px + env(safe-area-inset-bottom)); right: calc(8px + env(safe-area-inset-right)); width: 210px; }

      /* --- Touch targets ---------------------------------------------------
         44px is the smallest reliably tappable target. The desktop controls are
         ~24px tall and sit shoulder to shoulder, which on a phone produced
         mis-taps between adjacent buttons. Touch-only, via pointer: coarse, so
         a desktop mouse keeps the dense layout. */
      @media (pointer: coarse) {
        button {
          min-height: 44px; padding: 8px 14px; font-size: 13px;
          /* A tap must not also select text or raise a long-press callout. */
          touch-action: manipulation; -webkit-tap-highlight-color: transparent;
          user-select: none; -webkit-user-select: none;
        }
        input[type='range'] { width: 100%; min-height: 44px; }
        input[type='number'] {
          width: 84px; min-height: 40px; font: inherit; font-size: 14px;
          background: #1a2331; color: inherit;
          border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px;
        }
        .row { gap: 8px; }
        .panel { padding: 10px 12px; }
        h1 { font-size: 12px; }
      }

      /* --- Landscape phones ------------------------------------------------
         Vertical space is the scarce axis when the device is on its side, and
         the panels are anchored to top and bottom. Cap their heights and let
         them scroll rather than pushing into each other. */
      @media (max-height: 460px) and (orientation: landscape) {
        #controls, #stats, #legend, #inspect { max-height: 44dvh; max-height: 44vh; overflow: auto; }
        #inspect { width: min(46vw, 300px); }
      }

      /* Collapsible panels. Four fixed corners cannot all fit on a small
         screen, so each panel collapses to just its header. Collapsing is what
         makes overlap avoidable at ANY viewport rather than merely unlikely at
         a chosen breakpoint: at most one tall panel plus a few pills. */
      .panel > h1 {
        cursor: pointer; user-select: none; display: flex; align-items: center;
        justify-content: space-between; gap: 8px; margin-bottom: 0;
        /* Enlarge the tap target for the disclosure toggle without changing how
           the header looks: padding expands the hit area, not the glyphs. */
        padding: 2px 0; min-height: 24px;
      }
      @media (pointer: coarse) {
        .panel > h1 { min-height: 40px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
      }
      .panel > h1::after { content: '\25BE'; font-size: 9px; opacity: .6; }
      .panel.collapsed { padding: 5px 9px; }
      .panel.collapsed > h1 { margin-bottom: 0; }
      .panel.collapsed > h1::after { content: '\25B8'; }
      .panel.collapsed > *:not(h1) { display: none; }
      /* #inspect keeps its own show/hide contract: it is display:none until an
         organism is selected. Collapsing must never make it visible. */
      #inspect.collapsed { display: none !important; }

      .row { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
      .row + .row { margin-top: 5px; }
      button {
        font: inherit; color: var(--text); background: #1a2331; border: 1px solid var(--line);
        border-radius: 4px; padding: 3px 7px; cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button[aria-pressed='true'] { background: #21384a; border-color: var(--accent); color: var(--accent); }
      label { color: var(--dim); }
      input[type='range'] { width: 92px; accent-color: var(--accent); }
      table { border-collapse: collapse; width: 100%; }
      td { padding: 0 4px 0 0; vertical-align: top; }
      td.k { color: var(--dim); white-space: nowrap; }
      h1 { font-size: 11px; margin: 0 0 5px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
      .warn { color: #ffb86b; }
      .tiny { font-size: 10px; color: var(--dim); }
      .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
      #btn-genome[aria-pressed='true'] { border-color: var(--accent); color: var(--accent); background: #21384a; }
    </style>
  </head>
  <body>
    <div id="stage"></div>

    <div class="panel" id="controls">
      <h1>Simulation</h1>
      <div class="row">
        <button id="btn-pause">Pause</button>
        <button id="btn-1x" aria-pressed="true">1&times;</button>
        <button id="btn-4x">4&times;</button>
        <button id="btn-16x">16&times;</button>
        <button id="btn-max">Max</button>
      </div>
      <div class="row">
        <label for="pop">founders</label>
        <input id="pop" type="range" min="200" max="20000" step="200" value="1200" />
        <span id="pop-val" class="tiny">1200</span>
      </div>
      <div class="row">
        <label for="seed">seed</label>
        <input id="seed" type="number" value="7" style="width:64px;background:#1a2331;color:inherit;border:1px solid var(--line);border-radius:4px;padding:2px 4px" />
        <button id="btn-restart">Restart</button>
      </div>
      <div class="row">
        <button id="btn-morph" aria-pressed="false">Morphology</button>
        <button id="btn-overlay">Substrate</button>
        <button id="btn-disturb">Disturbances</button>
      </div>
      <div class="row">
        <button id="btn-genome" aria-pressed="false" title="Diagnostic: modular genome v2. Off = declared behaviour (null).">Genome&nbsp;v2</button>
        <span class="tiny" id="genome-note">off &mdash; declared behaviour</span>
      </div>
      <div class="row tiny" id="hint">
        <span id="hint-pointer">drag to pan &middot; pinch or wheel to zoom &middot; tap an organism to inspect</span>
      </div>
    </div>

    <div class="panel" id="stats">
      <h1>World</h1>
      <table id="stats-table"></table>
      <div class="row tiny" id="fps-line"></div>
    </div>

    <div class="panel" id="legend">
      <h1>Trophic role</h1>
      <div id="legend-rows"></div>
    </div>

    <div class="panel" id="inspect"></div>

    <script type="importmap">
      { "imports": { "pixi.js": "/pixi.mjs" } }
    </script>
    <script type="module" src="/view/viewer.js"></script>
  </body>
</html>
